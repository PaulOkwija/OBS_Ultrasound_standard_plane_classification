[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afro-fetalnet-api"
version = "1.0.0"
description = "Inference server for Afro-FetalNet fetal ultrasound plane classifiers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=0.9.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
